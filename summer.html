<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414;--s1:#1f1f1f;--s2:#2a2a2a;--s3:#333;--bdr:#333;--bdr2:#444;
  --gold:#fff;--gold2:#e0e0e0;--gf:rgba(255,255,255,.06);
  --txt:#fff;--muted:#a0a0a0;--mute2:#666;
  --nf:#E50914;--nf2:#ff3a44;
  --p1:#3ecf8e;--p2:#b06fe0;--p3:#4a90e2;--p4:#E50914;
  --f1:rgba(62,207,142,.13);--f2:rgba(176,111,224,.13);--f3:rgba(74,144,226,.13);--f4:rgba(229,9,20,.13);
  --grn:#22c55e;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column}

/* header */
.hdr{background:#000;border-bottom:3px solid var(--nf);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-t{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.15em;color:#fff;text-shadow:2px 2px 15px rgba(229,9,20,.5)}
.hdr-s{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.05em}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:4px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sync-btn{background:none;border:1px solid var(--bdr2);border-radius:4px;padding:4px 10px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:.12s}
.sync-btn:hover{color:#fff;border-color:#fff}

/* nav */
.nav{background:#000;border-bottom:1px solid var(--bdr);display:flex;flex-shrink:0}
.nb{flex:1;padding:11px 3px 9px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-size:9px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.12s;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.nb .ni{font-size:15px;display:flex;align-items:center;justify-content:center;height:20px}
.nb .ni svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.nb.on .ni svg{transform:translateY(-1px) scale(1.06)}.nb.on{color:#fff;border-bottom-color:var(--nf)}
.nb:hover{color:#fff}

/* layout */
.main{flex:1;overflow-y:auto}
.pg{display:none;padding:14px;max-width:540px;margin:0 auto}
.pg.on{display:block}

/* cards */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:8px;padding:14px;margin-bottom:11px;transition:box-shadow .2s}
.ch{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.12em;color:#fff;margin-bottom:11px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.ch::before{content:'';width:3px;height:16px;background:var(--nf);border-radius:2px;flex-shrink:0}
.ch::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* hero */
.hero{background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid var(--bdr2);border-top:3px solid var(--nf);border-radius:8px;padding:20px 16px;margin-bottom:13px;text-align:center}
.hr{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.12em;color:#fff;line-height:1}
.hd{font-size:12px;color:var(--muted);margin-top:5px}
.hw{font-size:18px;font-weight:900;margin-top:8px;color:#fff}
.hn{font-size:11px;color:var(--muted);margin-top:4px}

/* player colours */
.c1{color:var(--p1)}.c2{color:var(--p2)}.c3{color:var(--p3)}.c4{color:var(--p4)}
.bg1{background:var(--f1)}.bg2{background:var(--f2)}.bg3{background:var(--f3)}.bg4{background:var(--f4)}
.bcrd1{border-color:rgba(62,207,142,.35)!important}.bcrd2{border-color:rgba(176,111,224,.35)!important}
.bcrd3{border-color:rgba(74,144,226,.35)!important}.bcrd4{border-color:rgba(229,9,20,.35)!important}

/* ---- S ROUND: PLAYER SELECT ---- */
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pl-btn{padding:18px 10px;border-radius:8px;border:2px solid var(--bdr2);background:var(--s2);cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;transition:.13s;text-align:center;color:#fff}
.pl-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.5);border-color:#555}
.pl-btn:disabled{opacity:.45;cursor:default}
.pl-btn-sub{font-size:10px;font-weight:400;margin-top:4px;opacity:.7}

/* S ROUND: STATUS GRID */
.ss-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ss-card{border-radius:8px;padding:11px 12px;border:2px solid var(--bdr);text-align:center}
.ss-card.done{border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.07)}
.ss-card.waiting{border-color:var(--bdr);background:var(--s2)}
.ss-name{font-size:13px;font-weight:700;margin-bottom:4px}
.ss-badge{font-size:12px}

/* S ROUND: REVEAL GRID */
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rv-card{border-radius:8px;padding:13px;border:2px solid var(--bdr);background:var(--s2);text-align:center;position:relative}
.rv-card.conflict{border-color:rgba(229,9,20,.7);background:rgba(229,9,20,.07);animation:cpulse 2s ease-in-out infinite}
.rv-card.ok{border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.06)}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.8}}
.rv-player{font-size:11px;font-weight:700;margin-bottom:6px}
.rv-school{font-size:15px;font-weight:900;line-height:1.2}
.rv-r1{font-size:10px;color:var(--muted);margin-top:4px}
.rv-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:3px;margin-top:5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tag-ok{background:rgba(62,207,142,.2);color:#6ee7b7}
.tag-ng{background:rgba(229,9,20,.2);color:#fca5a5}

/* conflict group */
.cfl-box{background:rgba(229,9,20,.07);border:1px solid rgba(229,9,20,.3);border-radius:8px;padding:13px;margin-bottom:10px}
.cfl-title{font-size:12px;color:#fca5a5;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.cfl-players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cfl-p{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.15)}

/* school grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb{background:var(--s2);border:1px solid var(--bdr);border-radius:7px;padding:9px 10px;cursor:pointer;text-align:left;transition:.13s;width:100%}
.sb:hover:not(:disabled){border-color:#fff;background:var(--gf);transform:translateY(-1px)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.sb.tk1{background:var(--f1);border-color:rgba(62,207,142,.4)}
.sb.tk2{background:var(--f2);border-color:rgba(176,111,224,.4)}
.sb.tk3{background:var(--f3);border-color:rgba(74,144,226,.4)}
.sb.tk4{background:var(--f4);border-color:rgba(229,9,20,.4)}
.sn{font-size:13px;font-weight:700;color:#fff}
.ss2{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}
.bl{font-size:9px;padding:1px 5px;border-radius:3px;display:inline-block;font-weight:700}
.blA{background:rgba(168,85,247,.2);color:#c084fc}.blB{background:rgba(59,130,246,.2);color:#93c5fd}
.blC{background:rgba(16,185,129,.2);color:#6ee7b7}.blD{background:rgba(249,115,22,.2);color:#fdba74}

/* picks */
.pw{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pc{background:var(--s2);border:1px solid var(--bdr);border-radius:8px;padding:11px}
.pp{font-size:13px;font-weight:900;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.05em}
.pcnt{font-size:10px;color:var(--muted);font-weight:400;text-transform:none}
.pi{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:11px}
.pi:last-child{border:none}
.rt{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:700;flex-shrink:0}
.rtS{background:#E50914;color:#fff}.rtA{background:#1e3a5f;color:#7dd3fc}.rtB{background:#064e3b;color:#6ee7b7}
.rtC{background:#451a03;color:#fcd34d}.rtD{background:#4c0519;color:#fda4af}.rtE{background:#333;color:#a8a29e}
.rtF{background:#0c4a6e;color:#bae6fd}.rtG{background:#2e1065;color:#d8b4fe}
.rtH{background:#3f3f46;color:#e4e4e7}.rtI{background:#134e4a;color:#99f6e4}.rtJ{background:#4a044e;color:#f0abfc}.rtK{background:#422006;color:#fde68a}.rtL{background:#1a1a1a;color:#777}
.oshi-star{color:#fbbf24;margin-right:2px}
.pp-pts{margin-left:auto;font-weight:700;color:#fff;font-size:11px}

/* results */
.mr{display:flex;align-items:center;gap:5px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.mr:last-child{border:none}
.mt{flex:1;text-align:center;font-size:12px;font-weight:500;min-width:0;line-height:1.4}
.mv{color:var(--mute2);font-size:10px;flex-shrink:0}
.mw{padding:5px 7px;border-radius:4px;border:1px solid var(--bdr2);background:var(--s2);color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
.mw.on{background:var(--nf);color:#fff;border-color:var(--nf);font-weight:700}
.mpend{font-size:11px;color:var(--mute2);text-align:center;padding:7px 0}

/* score */
.stbl{width:100%;border-collapse:collapse}
.stbl th{padding:7px 5px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;border-bottom:1px solid var(--bdr);text-align:center;text-transform:uppercase}
.stbl td{padding:9px 5px;border-bottom:1px solid var(--bdr);text-align:center;font-size:12px}
.sr{font-family:'Bebas Neue',sans-serif;font-size:21px}
.sn2{text-align:left!important;font-weight:700;font-size:13px}
.stot{font-family:'Bebas Neue',sans-serif;font-size:21px;color:#fff}

/* buttons */
.btn{padding:11px 16px;border-radius:6px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:.12s;text-transform:uppercase}
.btn-g{background:var(--nf);color:#fff}.btn-g:hover{background:var(--nf2)}.btn-g:disabled{opacity:.4;cursor:not-allowed}
.btn-o{background:var(--s2);color:#fff;border:1px solid var(--bdr2)}.btn-o:hover{border-color:#fff}
.btn-r{background:#3a0000;color:#fca5a5;border:1px solid rgba(229,9,20,.4)}
.btn-big{padding:15px;font-size:15px;border-radius:8px}
.bblock{width:100%;margin-top:8px}
.sl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--bdr)}
.alrt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:10px 13px;font-size:12px;line-height:1.7;margin-bottom:10px}
.alrt-g{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.3)}
.alrt-r{background:rgba(229,9,20,.07);border-color:rgba(229,9,20,.3)}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.wtag{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(229,9,20,.2);color:#ff8080;margin-left:3px}
.sk0{color:#22c55e}.sk2{color:var(--p2)}.sk3{color:var(--p4)}.sk4{color:#ef4444}
.dsel{width:100%;background:var(--s3);color:#fff;border:1px solid var(--bdr2);border-radius:6px;padding:9px 10px;font-size:13px;font-family:inherit;cursor:pointer}
.dsel:focus{outline:none;border-color:#fff}

/* ---- AUTO FETCH ---- */
.fetch-bar{background:var(--s2);border:1px solid var(--bdr2);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.fetch-top{display:flex;align-items:center;gap:10px}
.fetch-info{flex:1}
.fetch-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.fetch-status{font-size:11px;color:var(--muted);line-height:1.5}
.fetch-status.ok{color:#6ee7b7}.fetch-status.err{color:#fca5a5}.fetch-status.loading{color:var(--nf);animation:blink 1s infinite}
.fetch-btn{padding:9px 14px;border-radius:6px;border:1px solid var(--bdr2);background:var(--s3);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:.12s;text-transform:uppercase;letter-spacing:.05em}
.fetch-btn:hover:not(:disabled){border-color:#fff;color:#fff}
.fetch-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- AMIDA MODAL ---- */
#amida-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;align-items:center;justify-content:center;padding:16px}
#amida-overlay.show{display:flex}
.amida-box{background:var(--s1);border:2px solid var(--nf);border-radius:12px;padding:26px 20px;max-width:340px;width:100%;text-align:center}
.amida-ttl{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.15em;color:#fff;margin-bottom:4px}
.amida-school{font-size:16px;font-weight:900;color:#fff;margin-bottom:18px}
.amida-cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.amida-card{width:72px;height:72px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.15);transition:all .2s}
.amida-card.spin{animation:spin .12s ease-in-out infinite alternate}
.amida-card.win{transform:scale(1.25)!important;border-color:var(--nf)!important;box-shadow:0 0 28px rgba(229,9,20,.7);animation:none}
.amida-card.lose{transform:scale(.85)!important;opacity:.3;animation:none}
@keyframes spin{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
.amida-result{font-size:18px;font-weight:900;margin:4px 0 16px;min-height:28px;color:#fff}
.amida-note{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6}
</style>

// 2回戦16試合の各枠ソース。文字列=シード校、{r1:i}=1回戦iの勝者。
const R2SRC=[
  ['高岡商','高川学園'],        // 0

// 汎用リゾルバ: 試合IDと枠(side=0/1)から、その枠に入る校名を返す（未確定ならnull）
function teamAt(mid,side){
  if(mid.startsWith('r1_')){const i=+mid.split('_')[1];const p=R1P[i];return p?p[side]:null;}
  if(mid.startsWith('r2_')){
    const i=+mid.split('_')[1];const src=R2SRC[i];if(!src)return null;
    const s=src[side];
    if(typeof s==='string')return s;
    if(s&&typeof s==='object'&&'r1'in s)return ST.rs['r1_'+s.r1]||null;
    return null;
  }
  if(mid.startsWith('r3_')){const i=+mid.split('_')[1];return ST.rs['r2_'+(2*i+side)]||null;}
  if(mid.startsWith('qf_')){const i=+mid.split('_')[1];return ST.rs['r3_'+(2*i+side)]||null;}
  if(mid.startsWith('sf_')){const i=+mid.split('_')[1];return ST.rs['qf_'+(2*i+side)]||null;}
  if(mid==='final'){return ST.rs['sf_'+side]||null;}
  return null;
}

// ==============================
// STATE
// ==============================
// ST.sd  = {playerName: schoolName}  ← S巡宣言（開票まで非表示）
// ST.ss  = {playerName: true}        ← 提出済みフラグ（学校名は非表示）
// ST.so  = bool                      ← 開票済み
// ST.snr = [playerName, ...]         ← 再指名待ちキュー
// ST.pk  = {school: {pl,ri}}         ← 確定指名
// ST.rs  = {matchId: winnerName}     ← 試合結果
const EMPTY_MANUAL=()=>({本川:{opt:0},太田:{opt:0},新井:{opt:0},若林:{opt:0}});
let ST={ri:0,wi:0,sd:{},ss:{},so:false,snr:[],snrd:{},snrs:{},snro:false,pk:{},rs:{},manual:EMPTY_MANUAL(),sj:null};
const KEY='natsu2026v1';

// ローカル変数（共有しない）
let localPlayer=null; // このデバイスで操作中のプレイヤー
let amidaContext=null; // {school, players, winner}

// ==============================
// STORAGE — Firebase Realtime Database
// ==============================
const EMPTY_ST=()=>({ri:0,wi:0,sd:{},ss:{},so:false,snr:[],snrd:{},snrs:{},snro:false,pk:{},rs:{},sc:{},amidaResults:{},fetchLocked:false,manual:EMPTY_MANUAL(),sj:null});

async function sv(){
  try{
    const _pkCount=ST.pk?Object.keys(ST.pk).length:0;
    if(_pkCount===0){
      const _bk=_loadPkBackup();
      if(_bk&&Object.keys(_bk).length>0){
        // 過去に指名があったのにpkが空＝データ喪失の疑い。バックアップから復元して通常書き込み。
        ST.pk=_bk;console.warn('[sv] pk restored from backup');
        _savePkBackup();
        await window._fbSet(ST);
        return;
      }
      // pk空＋バックアップ無し＝指名前（入札フェーズ等）。これは正常な状態。
      // pkを空で上書きしてFirebase側を消さないよう、pk以外のフィールドのみ同期する。
      const rest={...ST}; delete rest.pk;
      await window._fbUpdate(rest);
      return;
    }
    _savePkBackup();
    await window._fbSet(ST);
  }catch(e){console.error('Firebase write error',e);}
}
async function ld(){
  // 初回ロードはリスナー側で処理するため sv/ld パターンは書き込みのみ使用
}
function mergeData(d){
  if(d === null || d === undefined){
    console.warn('[mergeData] received null from Firebase - ignoring');
    return;
  }
  const incoming = d || {};
  const prev = ST || {};
  const incomingPkCount = incoming.pk ? Object.keys(incoming.pk).length : 0;
  const localPkCount = prev.pk ? Object.keys(prev.pk).length : 0;
  if(incomingPkCount === 0 && localPkCount > 0){
    console.warn('[mergeData] Firebase pk empty but local has', localPkCount, 'picks - keeping local');
    ST = {...EMPTY_ST(), ...incoming, pk: prev.pk, rs: incoming.rs||prev.rs||{}, sc: incoming.sc||prev.sc||{}};
    return;
  }
  if(incomingPkCount === 0){
    const backup = _loadPkBackup();
    if(backup && Object.keys(backup).length > 0){
      console.warn('[mergeData] Firebase pk empty - restoring from localStorage backup');
      ST = {...EMPTY_ST(), ...incoming, pk: backup};
      return;
    }
  }
  ST = {...EMPTY_ST(), ...incoming};
  if(!ST.manual)ST.manual=EMPTY_MANUAL();
  if(ST.ri===0&&ST.pk&&Object.keys(ST.pk).length===48){ST.ri=12;ST.wi=0;}
}
function _savePkBackup(){
  try{ if(ST.pk && Object.keys(ST.pk).length > 0) localStorage.setItem('natsu2026_pk_backup', JSON.stringify(ST.pk)); }catch(e){}
}
function _loadPkBackup(){
  try{ const s=localStorage.getItem('natsu2026_pk_backup'); return s?JSON.parse(s):null; }catch(e){ return null; }
}

// ==============================
// HELPERS
// ==============================
const plr=n=>PL.find(p=>p.name===n);
const rem=()=>SC.filter(s=>!ST.pk[s.n]);
const ppk=n=>Object.entries(ST.pk).filter(([,v])=>v.pl===n).sort((a,b)=>a[1].ri-b[1].ri);
const done=()=>ST.ri>=RD.length;
const cr=()=>RD[ST.ri];
const cw=()=>getWV(ST.ri)[ST.wi];
// 未指名校（ジョーカー）: ドラフト完了時に1校
const jokerSchool=()=>{const r=rem();return r.length===1?r[0].n:null;};
// 学校の数値ランク（指名巡+1、未指名=ジョーカー=13/ランクL）
function schoolRank(name){const pk=ST.pk[name];return pk?pk.ri+1:JOKER_RANK;}
function pki(nm){const p=ST.pk[nm];if(!p)return null;return{...p,pl:plr(p.pl),rd:RD[p.ri]};}
function wns(s){return Object.values(ST.rs).filter(w=>w===s).length;}
function isOut(s){
  // 全試合結果を見て、sが負けた試合があればtrue
  for(const [mid,w] of Object.entries(ST.rs)){
    if(w && w!==s){
      // この試合にsが出場していたか確認
      const l=loser(mid,w);
      if(l===s)return true;
    }
  }
  return false;
}
// loser(): teamAtで両校を解決し、勝者wでない方（=敗者）を返す。
// 両校未確定 or wが対戦カードに含まれない場合はnull。
function loser(mid,w){
  const a=teamAt(mid,0),b=teamAt(mid,1);
  if(!a||!b)return null;
  if(w===a)return b;
  if(w===b)return a;
  return null;
}
// 学校単体の得点（基本点＋アップセット、推し校なら勝利点2倍、優勝/準優勝ボーナス）
function spts(s){
  const pk=ST.pk[s];if(!pk)return 0;
  const rd=RD[pk.ri];
  const base=(rd&&rd.id===CONF.bonusRank)?50:30;
  const wr=pk.ri+1;
  let winPts=0;
  Object.entries(ST.rs).forEach(([mid,w])=>{
    if(w!==s)return;
    let p=base;
    const ls=loser(mid,w);
    if(ls){const lr=schoolRank(ls);if(wr>lr)p+=(wr-lr)*10;}
    winPts+=p;
  });
  if(pk.oshi)winPts*=2;              // 推し校: 勝利点(基本+アップセット)2倍
  let pts=winPts;
  if(ST.rs.final===s)pts+=70;        // 優勝
  if(ST.rs.final){const fl=loser('final',ST.rs.final);if(fl===s)pts+=30;} // 準優勝
  return pts;
}
// 全プレイヤーのスコア内訳
function allScores(){
  const sc={};
  CONF.drafters.forEach(n=>{sc[n]={base:0,upset:0,oshi:0,joker:0,champ:0,b8:0,b8count:0,manual:0,w:0,tot:0};});
  // 各指名校の勝利点・アップセット・優勝準優勝
  Object.entries(ST.pk).forEach(([school,pk])=>{
    const owner=pk.pl;if(!sc[owner])return;
    const rd=RD[pk.ri];const base=(rd&&rd.id===CONF.bonusRank)?50:30;
    const wr=pk.ri+1;
    let winBase=0,winUpset=0,wins=0;
    Object.entries(ST.rs).forEach(([mid,w])=>{
      if(w!==school)return;
      wins++;winBase+=base;
      const ls=loser(mid,w);
      if(ls){const lr=schoolRank(ls);if(wr>lr)winUpset+=(wr-lr)*10;}
    });
    sc[owner].w+=wins;sc[owner].base+=winBase;sc[owner].upset+=winUpset;
    if(pk.oshi)sc[owner].oshi+=(winBase+winUpset); // 2倍化で追加される分
    if(ST.rs.final===school)sc[owner].champ+=70;
    if(ST.rs.final){const fl=loser('final',ST.rs.final);if(fl===school)sc[owner].champ+=30;}
  });
  // ジョーカー負けマイナス（30+ランク差）: loser()実装後に有効化
  const jk=jokerSchool();
  if(jk){
    Object.entries(ST.rs).forEach(([mid,w])=>{
      if(w!==jk)return;
      const ls=loser(mid,w);
      if(ls&&ST.pk[ls]){const lr=ST.pk[ls].ri+1;const pen=30+(JOKER_RANK-lr);sc[ST.pk[ls].pl].joker-=pen;}
    });
  }
  // B8残留ボーナスは廃止（2026ルール変更）。ベスト8残留数は参考表示のみ・加点なし。
  const b8={};CONF.drafters.forEach(n=>b8[n]=0);
  for(let i=0;i<8;i++){const w=ST.rs[`r3_${i}`];if(w&&ST.pk[w])b8[ST.pk[w].pl]++;}
  CONF.drafters.forEach(n=>{sc[n].b8count=b8[n];});
  // sc[n].b8（加点）は常に0のまま
  // 手動補正
  CONF.drafters.forEach(n=>{const m=ST.manual&&ST.manual[n];if(m)sc[n].manual=(+m.opt||0);});
  // 合計
  CONF.drafters.forEach(n=>{const s=sc[n];s.tot=s.base+s.upset+s.oshi+s.joker+s.champ+s.b8+s.manual;});
  return sc;
}

// ==============================
// 未解決競合を計算
// ==============================
function getPendingConflicts(){
  // sd のうち複数人が同じ学校を選んでいて、まだ pk に入っていないもの
  const grp={};
  Object.entries(ST.sd).forEach(([pl,s])=>{
    if(ST.pk[s]) return; // すでに確定済み
    if(!grp[s])grp[s]=[];
    grp[s].push(pl);
  });
  return Object.entries(grp).filter(([,ps])=>ps.length>1).map(([s,ps])=>({school:s,players:ps}));
}

function rDraft(){
  const el=document.getElementById('pg-draft');

    el.innerHTML=`<div class="hero"><div class="hr">ドラフト完了！</div><div class="hd">全48校の指名が完了しました</div></div><div class="alrt alrt-g" style="text-align:center">「指名」タブで推し校（7〜12巡目=F〜K巡から1校）を指定してください<br><button class="btn btn-g" style="margin-top:9px" onclick="gp('picks',document.querySelectorAll('.nb')[1])">🃏 指名一覧へ →</button></div>`;
    return;
  }
  if(!isBid(ST.ri)){el.innerHTML=rWaiver();return;}
  // 入札巡フロー（S巡=ri0 / A巡=ri1）
  if(ST.so){
    const pending=getPendingConflicts();
    if(pending.length>0){el.innerHTML=rSReveal();return;}   // 未解決競合あり→開票画面
    if(ST.snr.length>0){                                    // 全競合解決済み→再指名フェーズ
      if(ST.snro){
        const rPending=getRepickConflicts();
        if(rPending.length>0){el.innerHTML=rSRepickReveal();return;} // 再指名も競合
        if(anyRepickPending()){el.innerHTML=rSRepickReveal();return;} // 確定待ち
        el.innerHTML=rSRepickReveal();return;
      }
      el.innerHTML=rSRepickSelect();return;
    }
    el.innerHTML=rSReveal();return;                         // 全員確定→A巡ボタン
  }
  el.innerHTML=rSSelect();
}

function getRepickConflicts(){
  const already=new Set(Object.keys(ST.pk));

    if(already.has(s))return;
    if(!grp[s])grp[s]=[];
    grp[s].push(pl);

  return Object.entries(grp).filter(([,ps])=>ps.length>1).map(([s,ps])=>({school:s,players:ps}));
}

  return ST.snr.some(n=>!ST.pk[ST.snrd[n]]);

// AMIDA KUJI
// ==============================
let amidaWinner=null;
let conflictList=[];

function showAmidaByIdx(idx){
  const c=conflictList[idx];
  if(!c)return;
  showAmida(c.school,c.players);
}

function showAmida(school, players){
  // 競合者のみに絞る
  const conflictPlayers = players.filter(p => !ST.pk[school] || ST.pk[school].pl === p);
  amidaContext={school, players:conflictPlayers};
  amidaWinner=null;

  // 既に結果がある場合は結果を表示
  const existingWinner = ST.amidaResults && ST.amidaResults[school];

  document.getElementById('amida-school-name').textContent=`「${school}」の指名権`;
  document.getElementById('amida-note').textContent=`${conflictPlayers.join('・')} が競合しています`;

  const cards=document.getElementById('amida-cards');
  cards.innerHTML=conflictPlayers.map(name=>{
    const p=plr(name);
    return `<div class="amida-card" id="acard-${name}" style="background:${p.col}22;border-color:${p.col}55;color:${p.col}">${name}</div>`;
  }).join('');

  if(existingWinner){
    amidaWinner=existingWinner;
    document.getElementById('amida-result').textContent=`🎉 ${existingWinner} さんが当選！`;
    document.getElementById('amida-btn').style.display='none';
    document.getElementById('amida-confirm').style.display='block';
    conflictPlayers.forEach(name=>{
      const el=document.getElementById(`acard-${name}`);
      if(el){el.classList.remove('spin');el.classList.add(name===existingWinner?'win':'lose');}
    });
  } else {
    document.getElementById('amida-result').textContent='';
    document.getElementById('amida-btn').style.display='block';
    document.getElementById('amida-btn').textContent='くじを引く！';
    document.getElementById('amida-btn').disabled=false;
    document.getElementById('amida-confirm').style.display='none';
  }

  document.getElementById('amida-overlay').classList.add('show');
}

function startAmida(){
  if(!amidaContext) return;
  document.getElementById('amida-btn').disabled=true;

  const {school, players}=amidaContext;
  // アニメーション開始
  players.forEach(name=>{
    const el=document.getElementById(`acard-${name}`);
    el.classList.add('spin');
    el.classList.remove('win','lose');
  });

  // 2秒後に結果を表示
  setTimeout(()=>{
    // ランダムに勝者を決定
    const winner=players[Math.floor(Math.random()*players.length)];
    amidaWinner=winner;

    players.forEach(name=>{
      const el=document.getElementById(`acard-${name}`);
      el.classList.remove('spin');
      if(name===winner)el.classList.add('win');
      else el.classList.add('lose');
    });

    document.getElementById('amida-result').textContent=`🎉 ${winner} さんが当選！`;
    document.getElementById('amida-note').textContent=`${winner}さんが「${school}」の指名権を獲得しました`;
    document.getElementById('amida-btn').style.display='none';
    document.getElementById('amida-confirm').style.display='block';
  }, 2000);
}

async function confirmAmida(){
  if(!amidaContext||!amidaWinner) return;
  const {school, players}=amidaContext;
  const winner=amidaWinner;
  const losers=players.filter(n=>n!==winner);

  // あみだ結果をFirebaseに保存（全員統一）
  if(!ST.amidaResults) ST.amidaResults={};
  ST.amidaResults[school]=winner;

  // 勝者の指名を確定
  ST.pk[school]={pl:winner, ri:ST.ri};

  // 再指名フェーズか初回S巡かを判定
  const isRepickPhase = ST.snr.length>0 && players.some(n=>ST.snr.includes(n));

  if(isRepickPhase){
    // 再指名フェーズ: 敗者を再び再指名キューへ戻し、次ラウンドの選択をリセット
    const newSnr=losers.filter(n=>ST.snr.includes(n));
    // snrを敗者だけに絞って再選択させる
    ST.snr=newSnr;
    ST.snrd={};ST.snrs={};ST.snro=false;
  } else {
    // 初回S巡: 敗者を再指名キューに追加
    losers.forEach(l=>{if(!ST.snr.includes(l))ST.snr.push(l);});
  }

  await sv();
  document.getElementById('amida-overlay').classList.remove('show');
  amidaContext=null;
  amidaWinner=null;
  rDraft();
}

    '聖隷クリストファー高校':'聖隷クリストファー','聖隷クリストファー高':'聖隷クリストファー','聖隷':'聖隷クリストファー',
    '東日本国際大昌平':'東日大昌平','東日本国際大付昌平':'東日大昌平','東日本国際大付属昌平':'東日大昌平','東日大昌平高校':'東日大昌平',
    '立正大淞南高校':'立正大淞南','淞南':'立正大淞南',
    '東海大甲府高校':'東海大甲府','東海大付甲府':'東海大甲府',
    '関東第一高校':'関東第一','関東一':'関東第一','関一':'関東第一',
    '八王子実践高校':'八王子実践',
    '岡山学芸館高校':'岡山学芸館','鳥取城北高校':'鳥取城北',
    '立命館宇治高校':'立命館宇治','明徳義塾高校':'明徳義塾',
    '日南学園高校':'日南学園','神村学園高校':'神村学園','沖縄尚学高校':'沖縄尚学',
    '仙台育英高校':'仙台育英','花巻東高校':'花巻東','横浜高校':'横浜',
    '健大高崎高校':'健大高崎','花咲徳栄高校':'花咲徳栄','鶴岡東高校':'鶴岡東',
    '拓大紅陵高校':'拓大紅陵','敦賀気比高校':'敦賀気比','松商学園高校':'松商学園',
    '高川学園高校':'高川学園','日本文理高校':'日本文理','鳴門渦潮高校':'鳴門渦潮',
    // --- 春や過去大会の別表記（残置・無害） ---
    '八戸光星':'八戸学院光星','光星学院':'八戸学院光星',
    '九国大付':'九州国際大付','九州国際大附':'九州国際大付','九国大附':'九州国際大付','九州国際大付属':'九州国際大付',
    '神戸国際大附':'神戸国際大付','神国大附':'神戸国際大付',
    '智辯学園':'智弁学園','智辯':'智弁学園',

}

// R1Pの対戦から正しいmatch IDにマッピング
// fetchしたデータは「勝者校名→どの試合か」を逆引きする
function applyFetchedResults(fetched){
  // fetchedは {matchId: winner} の形式で来る想定
  // validなキー
  const VALID_KEYS=[
    'r1_0','r1_1','r1_2','r1_3','r1_4','r1_5','r1_6','r1_7','r1_8',
    'r1_9','r1_10','r1_11','r1_12','r1_13','r1_14','r1_15','r1_16',
    'r2_0','r2_1','r2_2','r2_3','r2_4','r2_5','r2_6','r2_7',
    'r2_8','r2_9','r2_10','r2_11','r2_12','r2_13','r2_14','r2_15',
    'r3_0','r3_1','r3_2','r3_3','r3_4','r3_5','r3_6','r3_7',
    'qf_0','qf_1','qf_2','qf_3','sf_0','sf_1','final'
  ];
  let updated=0;
  if(!ST.sc)ST.sc={};
  VALID_KEYS.forEach(k=>{
    const raw=fetched[k];
    if(!raw||raw==='null')return;
    const norm=normalizeName(String(raw));
    const valid=SC.some(s=>s.n===norm);
    if(!valid){console.warn('不明な学校名:',raw,'→',norm);return;}
    if(ST.rs[k]!==norm){ST.rs[k]=norm;updated++;}
    if(window._fetchedSc&&window._fetchedSc[k])ST.sc[k]=window._fetchedSc[k];
    ST.fetchLocked=true;
  });
  return updated;
}

async function fetchResults(){
  const btn=document.getElementById('fbtn');
  const statusEl=document.getElementById('fs');
  if(btn)btn.disabled=true;
  fetchClass='loading';
  fetchLog='⏳ 取得中...';
  if(statusEl){statusEl.className='fetch-status loading';statusEl.textContent=fetchLog;}

  // 阪神甲子園球場公式サイトから取得（2026夏・後で正式URLに差し替え可）
  const TARGET='https://koshien.hanshin.co.jp/highschool/summer2026/schedule.html';
  // 複数プロキシを順番に試す
  const PROXIES=[
    `https://corsproxy.io/?${encodeURIComponent(TARGET)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(TARGET)}`,
  ];

  let html=null;
  let fetchErr='全プロキシ接続失敗';
  for(const PROXY of PROXIES){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),8000);
      const r=await fetch(PROXY,{signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok)continue;
      const text=await r.text();
      // allorigins形式（JSON）かHTML直接かを判定
      let result=text;
      if(text.trimStart().startsWith('{')){
        try{const j=JSON.parse(text);if(j.contents)result=j.contents;}catch(e){}
      }
      if(result&&result.length>500&&(result.includes('横浜')||result.includes('仙台育英'))){html=result;break;}
    }catch(e){
      fetchErr=e.name==='AbortError'?'タイムアウト':e.message;
      continue;
    }
  }

  if(!html){
    fetchClass='err';
    fetchLog='❌ 取得失敗: '+fetchErr;
    if(statusEl){statusEl.className='fetch-status err';statusEl.textContent=fetchLog;}
    if(btn)btn.disabled=false;
    return;
  }

  if(!html||html.length<500){
    fetchClass='err';
    fetchLog='❌ 取得失敗: ページが取得できませんでした';
    if(statusEl){statusEl.className='fetch-status err';statusEl.textContent=fetchLog;}
    if(btn)btn.disabled=false;
    return;
  }

  // ページ内のテキストを取得
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');
  const bodyText=(doc.body?.textContent||'').replace(/[ \t]+/g,' ');

  const fetched={};

  // 阪神甲子園公式: "校名A (都道府県)スコアA - スコアB校名B (都道府県)"
  // 例: "横浜 (神奈川)4 - 3沖縄尚学 (沖縄)"
  // 校名は normalizeName（SC表記への正規化辞書）で統一する。
  function normSite(n){return normalizeName(n.trim())||n.trim();}

  // 突合対象の全matchID（1回戦〜決勝）。teamAtで現在確定している対戦カードと照合する。
  const ALL_MIDS=[];
  for(let i=0;i<17;i++)ALL_MIDS.push('r1_'+i);
  for(let i=0;i<16;i++)ALL_MIDS.push('r2_'+i);
  for(let i=0;i<8;i++)ALL_MIDS.push('r3_'+i);
  for(let i=0;i<4;i++)ALL_MIDS.push('qf_'+i);
  for(let i=0;i<2;i++)ALL_MIDS.push('sf_'+i);
  ALL_MIDS.push('final');

  // パターン: "校名 (都道府県)数字 - 数字校名 (都道府県)"
  const pat=/([^()\d\s][^()\d]{0,7})\s*\(([^)]{1,6})\)(\d+)\s*-\s*(\d+)([^()\d\s][^()\d]{0,7})\s*\(([^)]{1,6})\)/g;
  let m;
  window._fetchedSc={};
  const fetchedSc=window._fetchedSc;
  while((m=pat.exec(bodyText))!==null){
    const a=normSite(m[1]),sa=parseInt(m[3]),sb=parseInt(m[4]),b=normSite(m[5]);
    if(sa===sb)continue;
    const winner=sa>sb?a:b;
    // 各matchIDについて、teamAtで解決した対戦カードと突合。一致すれば勝者をセット。
    ALL_MIDS.forEach(mid=>{
      if(fetched[mid])return;
      const ra=teamAt(mid,0),rb=teamAt(mid,1);
      if(!ra||!rb)return;
      if((ra===a&&rb===b)||(ra===b&&rb===a)){
        fetched[mid]=winner;fetchedSc[mid]=ra===a?[sa,sb]:[sb,sa];
      }
    });
  }

  const updated=applyFetchedResults(fetched);
  if(updated>0)await sv();

  const now=new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  lastFetchTime=now;
  const found=Object.values(fetched).filter(Boolean).length;
  fetchClass='ok';
  fetchLog=found>0?`✅ ${now} — ${updated}試合更新（${found}試合検出）`:`✅ ${now} — 結果なし（試合前または未反映）`;
if(statusEl){statusEl.className='fetch-status ok';statusEl.textContent=fetchLog;}
  if(btn)btn.disabled=false;
    rAll();
}

// 大会期間中の夜間（20時以降）に自動取得
async function autoFetchIfNeeded(){
  const now=new Date();
  const jst=new Date(now.getTime()+9*3600*1000);
  const y=jst.getUTCFullYear(),m=jst.getUTCMonth()+1,d=jst.getUTCDate(),h=jst.getUTCHours();
  // 大会期間: 2026夏（8/5〜8/24頃）
  const inPeriod=(y===2026&&m===8&&d>=5&&d<=24);
  if(!inPeriod||h<20)return;
  await fetchResults();
}

function mrow(mid,tA,tB){
  const w=ST.rs[mid];
  const isMotoKawa=localPlayer==='本川';
  // チーム情報（プレイヤーカラー・巡目）
  function teamCell(t,align){
    const pi=pki(t);
    const col=pi?pi.pl.col:'#ffffff';
    const rb=pi?`<span class="rt rt${pi.rd.id}" style="display:inline-block;margin-top:3px">${pi.rd.lb}</span>`:'';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:${align==='right'?'flex-end':'flex-start'};gap:2px">
      <span style="font-size:13px;font-weight:700;color:${col}">${t}</span>
      ${rb}
    </div>`;
  }
  function teamCellLoser(t,align){
    const pi=pki(t);
    const rb=pi?`<span class="rt" style="display:inline-block;margin-top:3px;background:#2a2a2a;color:#444">${pi.rd.lb}</span>`:'';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:${align==='right'?'flex-end':'flex-start'};gap:2px;opacity:.35">
      <span style="font-size:13px">${t}</span>
      ${rb}
    </div>`;
  }
  if(w){
    const sc=ST.sc&&ST.sc[mid];
    const sA=sc?sc[0]:'';const sB=sc?sc[1]:'';
    const scoreBox=sA!==''?
      `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;background:#111;border-radius:6px;padding:4px 10px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-family:monospace;font-size:18px;font-weight:700;min-width:20px;text-align:center;color:${w===tA?pki(tA)?.pl?.col||'#fff':'#555'}">${sA}</span>
          <span style="color:#555;font-size:14px">-</span>
          <span style="font-family:monospace;font-size:18px;font-weight:700;min-width:20px;text-align:center;color:${w===tB?pki(tB)?.pl?.col||'#fff':'#555'}">${sB}</span>
        </div>
        <span style="font-size:9px;background:#2a2a2a;color:#888;border-radius:3px;padding:2px 6px;font-weight:700">✓ 終了</span>
      </div>`:
      `<div style="background:#111;border-radius:6px;padding:6px 10px;flex-shrink:0">
        <span style="font-size:9px;background:#2a2a2a;color:#888;border-radius:3px;padding:2px 6px;font-weight:700">✓ 終了</span>
      </div>`;
    const fixBtn=isMotoKawa?`<div style="text-align:center;margin-top:2px"><button onclick="clearR('${mid}')" style="background:none;border:none;color:#555;font-size:10px;cursor:pointer;text-decoration:underline">修正</button></div>`:'';
    return `<div class="mr" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;align-items:center;gap:6px">
        ${w===tA?teamCell(tA,'right'):teamCellLoser(tA,'right')}
        ${scoreBox}
        ${w===tB?teamCell(tB,'left'):teamCellLoser(tB,'left')}
      </div>${fixBtn}
    </div>`;
  }
  // 未入力：両チームともプレイヤーカラー＋巡目、ボタンあり
  return `<div class="mr" style="flex-direction:column;align-items:stretch;gap:8px">
    <div style="display:flex;align-items:center;gap:6px">
      ${teamCell(tA,'right')}
      <div style="background:#111;border-radius:6px;padding:4px 10px;flex-shrink:0">
        <span style="color:#555;font-size:12px;font-weight:700">vs</span>
      </div>
      ${teamCell(tB,'left')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <button class="mw" onclick="setR('${mid}','${tA}')" style="padding:10px 8px;font-size:13px;font-weight:700;text-align:center">◀ ${tA} 勝</button>
      <button class="mw" onclick="setR('${mid}','${tB}')" style="padding:10px 8px;font-size:13px;font-weight:700;text-align:center">${tB} 勝 ▶</button>
    </div>
  </div>`;
}

function bd(label,val,col){
  const c=col||(val<0?'#fca5a5':'var(--muted)');
  return `<span style="background:var(--s2);border-radius:4px;padding:2px 7px;color:${c}">${label} ${val>=0?'+':''}${val}</span>`;
}
function rScore(){
  const el=document.getElementById('pg-score');
  const sc=allScores();const sorted=PL.map(p=>({...p,s:sc[p.name]})).sort((a,b)=>b.s.tot-a.s.tot);
  const SK=['0P','-2,000P','-3,000P','-5,000P'];const SKC=['sk0','sk2','sk3','sk4'];
  let h=`<div class="card"><div class="ch">順位表</div><table class="stbl"><tr><th>順位</th><th style="text-align:left">名前</th><th>勝</th><th>基本</th><th>推し</th><th>手動</th><th>合計</th><th>ポイント</th></tr>`;
  sorted.forEach((p,i)=>{const s=p.s;h+=`<tr><td class="sr ${p.c}">${i+1}</td><td class="sn2 ${p.c}">${p.name}</td><td>${s.w}</td><td style="font-size:11px">${s.base}</td><td style="font-size:11px;color:#fbbf24">${s.oshi>0?'+'+s.oshi:'-'}</td><td style="font-size:11px">${s.manual!==0?s.manual:'-'}</td><td class="stot">${s.tot}</td><td class="${SKC[i]}" style="font-size:11px;font-weight:700">${SK[i]}</td></tr>`;});
  h+=`</table></div>`;
  PL.forEach(p=>{
    const pks=ppk(p.name);const s=sc[p.name];
    h+=`<div class="card ${p.bg} ${p.bc}" style="border:1px solid"><div class="ch ${p.c}">${p.name} — ${s.tot}pt（${s.w}勝）</div>`;
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:10px">${bd('基本',s.base)}${bd('アップセット',s.upset)}${bd('推し2倍',s.oshi,'#fbbf24')}${bd('優勝/準V',s.champ)}${bd('ジョーカー',s.joker)}${bd('手動',s.manual)}</div>`;

let _picking=false;
async function doPick(s){
  if(_picking)return;
  if(ST.pk[s]){alert('すでに指名済みです');return;}
  if(!localPlayer||localPlayer!==cw()){alert('あなたの番ではありません');return;}
  _picking=true;
  const pl=cw();ST.pk[s]={pl,ri:ST.ri,wi:ST.wi};ST.wi++;
  if(ST.wi>=getWV(ST.ri).length){ST.wi=0;ST.ri++;}
  localPlayer=null;
  await sv();rAll();
  _picking=false;
}
async function undoPick(){
  // 全指名の中で最後（wi最大・ri最大）のものを探して取り消す
  const all=Object.entries(ST.pk);
  if(!all.length){alert('取り消せる指名がありません');return;}
  // ri最大→その中でwi最大
  const last=all.sort((a,b)=>b[1].ri!==a[1].ri?b[1].ri-a[1].ri:b[1].wi-a[1].wi)[0];
  const lastRi=last[1].ri;
  const lastWi=last[1].wi;
  delete ST.pk[last[0]];
  ST.ri=lastRi;
  ST.wi=lastWi;
  localPlayer=null;
  await sv();rAll();
}

function rAll(){rDraft();rPicks();rResults();rScore();rManual();rRules();rCfg();}

// Firebase未接続チェック用
let fbReady = false;

(()=>{
  rAll();  // 初期描画（Firebase応答を待たず即表示。ルール未設定/オフラインでも画面が出る）
  // Firebaseリスナーが準備できるまで待つ
  const waitFb = setInterval(()=>{
    if(typeof window._fbListen !== 'function') return;
    clearInterval(waitFb);
    fbReady = true;

    // リアルタイムリスナー: Firebaseのデータが変わったら即反映
    window._fbListen((data)=>{
      const prevPkCount = ST.pk ? Object.keys(ST.pk).length : 0;
      mergeData(data);
      const newPkCount = ST.pk ? Object.keys(ST.pk).length : 0;
      if(prevPkCount > 0 && newPkCount === 0){
        console.error('[Listener] pk lost! Attempting restore...');
        const backup = _loadPkBackup();
        if(backup && Object.keys(backup).length > 0){ ST.pk = backup; sv(); }
      }
      rAll();
      // 初回Firebase受信後のみautoFetch実行
      if(!window._fbFirstLoaded){window._fbFirstLoaded=true;setTimeout(autoFetchIfNeeded,3000);}
    });

    // 1時間ごとに自動再取得チェック
    setInterval(()=>autoFetchIfNeeded(), 3600000);
  }, 200);

  // Firebaseが5秒で繋がらなければオフラインモードで起動
  setTimeout(()=>{
    if(!fbReady){
      console.warn('Firebase未接続 — オフラインモードで起動');
      ST = EMPTY_ST();
      rAll();
    }
  }, 5000);
})();
</script>
<script src="appmenu.js"></script>
</body>
